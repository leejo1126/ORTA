# Analysis environment (everything except cellpose segmentation).
#
# The analysis venv lives at S:/cluade code/ep-orca-if/.venv (repo-local); `interpreters.analysis`
# in IF/config/config.yaml + IF/scripts/pipeline/run_fovs.sh point at it. To recreate from scratch:
#   python -m venv "S:/cluade code/ep-orca-if/.venv"
#   "S:/cluade code/ep-orca-if/.venv/Scripts/python" -m pip install -r IF/env/requirements.lock
#   "S:/cluade code/ep-orca-if/.venv/Scripts/python" -m pip install -e IF
# (requirements.lock is the full pinned record; the core deps below are the minimum the pipeline needs.
# napari + PyQt6 in the lock are only for the interactive QC viewers under IF/scripts/qc/.)
#
# This file documents the intended environment for reproducibility / rebuild.
name: eporca-analysis
channels: [conda-forge]
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy
      - scipy
      - scikit-image
      - tifffile
      - pandas
      - scikit-learn
      - matplotlib
      - zarr
      - ome-zarr
      - anndata
      - umap-learn
      - leidenalg
      - igraph
      - pydantic>=2
      - pyyaml
      - snakemake
      - -e .
