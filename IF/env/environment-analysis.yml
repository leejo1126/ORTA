# Analysis environment (everything except cellpose segmentation).
#
# NOTE (reorg): the working venv currently lives at S:/cluade code/EP-ORCA/.venv, which is being
# retired. Before EP-ORCA/ is deleted (Phase 6), recreate this env at a repo-local location
# (S:/cluade code/ep-orca-if/.venv) and repoint `interpreters.analysis` in IF/config/config.yaml
# (and IF/scripts/pipeline/run_fovs.sh) to it. Recreate with:
#   python -m venv "S:/cluade code/ep-orca-if/.venv"
#   "S:/cluade code/ep-orca-if/.venv/Scripts/python" -m pip install -r IF/env/requirements.lock  # or the pins below
#   "S:/cluade code/ep-orca-if/.venv/Scripts/python" -m pip install -e IF
#
# This file documents the intended environment for reproducibility / rebuild.
name: eporca-analysis
channels: [conda-forge]
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy
      - scipy
      - scikit-image
      - tifffile
      - pandas
      - scikit-learn
      - matplotlib
      - zarr
      - ome-zarr
      - anndata
      - umap-learn
      - leidenalg
      - igraph
      - pydantic>=2
      - pyyaml
      - snakemake
      - -e .
